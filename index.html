<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>متجر HR409 - عجلة الحظ والبطاقات</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        .wheel-container {
            transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
        }
        .card-flip {
            perspective: 1000px;
        }
        .card-inner {
            transition: transform 0.6s;
            transform-style: preserve-3d;
        }
        .card-inner.flipped {
            transform: rotateY(180deg);
        }
        .card-front, .card-back {
            backface-visibility: hidden;
        }
        .card-back {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="bg-gray-900 text-white font-sans min-h-screen pb-10">

    <!-- Header -->
    <header class="p-4 bg-gray-800 text-center shadow-lg border-b border-gray-700">
        <h1 class="text-2xl font-bold text-yellow-400">متجر HR409</h1>
        <p class="text-xs text-gray-400">اكسب النقاط والجوائز اليومية!</p>
    </header>

    <main class="p-4 max-w-md mx-auto space-y-6">

        <!-- User Stats Card -->
        <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 flex justify-between items-center shadow">
            <div>
                <span class="text-gray-400 text-xs block">رصيد النقاط</span>
                <span id="user-points" class="text-2xl font-extrabold text-yellow-400">100</span>
            </div>
            <button onclick="claimDailyReward()" id="daily-btn" class="bg-blue-600 hover:bg-blue-700 text-white text-xs font-bold px-3 py-2 rounded-lg transition">
                مكافأة يومية (+10)
            </button>
        </div>

        <!-- Wheel Section -->
        <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 text-center shadow">
            <h2 class="text-md font-bold mb-3 text-yellow-400">عجلة تشارلز للحظ</h2>
            
            <div class="relative w-48 h-48 mx-auto my-4">
                <!-- Pointer -->
                <div class="absolute -top-2 left-1/2 -translate-x-1/2 z-10 w-0 h-0 border-l-8 border-r-8 border-t-[16px] border-l-transparent border-r-transparent border-t-red-500"></div>
                <!-- Wheel -->
                <div id="wheel" class="wheel-container w-full h-full rounded-full border-4 border-yellow-400 bg-gradient-to-tr from-purple-900 via-indigo-800 to-blue-900 flex items-center justify-center shadow-inner">
                    <span class="text-xs font-bold text-gray-300">HR409 Wheel</span>
                </div>
            </div>

            <button onclick="spinWheel()" id="spin-btn" class="w-full bg-yellow-500 hover:bg-yellow-600 text-gray-900 font-bold py-2 rounded-lg transition">
                تدوير العجلة
            </button>
        </div>

        <!-- Cards Game Section -->
        <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 text-center shadow space-y-3">
            <h2 class="text-md font-bold text-yellow-400">لعبة بطاقات الحظ</h2>
            <p class="text-xs text-gray-400">اختر بطاقة واحدة واكشف عن جائزتك!</p>
            
            <div class="grid grid-cols-3 gap-3 my-3">
                <!-- Card 1 -->
                <div class="card-flip h-24 cursor-pointer" onclick="flipCard(this, 0)">
                    <div class="card-inner relative w-full h-full">
                        <div class="card-front absolute w-full h-full bg-indigo-700 rounded-lg border border-yellow-400 flex items-center justify-center text-xl font-bold">؟</div>
                        <div class="card-back absolute w-full h-full bg-gray-700 rounded-lg border border-green-400 flex items-center justify-center text-xs font-bold p-1 text-center card-result">--</div>
                    </div>
                </div>
                <!-- Card 2 -->
                <div class="card-flip h-24 cursor-pointer" onclick="flipCard(this, 1)">
                    <div class="card-inner relative w-full h-full">
                        <div class="card-front absolute w-full h-full bg-indigo-700 rounded-lg border border-yellow-400 flex items-center justify-center text-xl font-bold">؟</div>
                        <div class="card-back absolute w-full h-full bg-gray-700 rounded-lg border border-green-400 flex items-center justify-center text-xs font-bold p-1 text-center card-result">--</div>
                    </div>
                </div>
                <!-- Card 3 -->
                <div class="card-flip h-24 cursor-pointer" onclick="flipCard(this, 2)">
                    <div class="card-inner relative w-full h-full">
                        <div class="card-front absolute w-full h-full bg-indigo-700 rounded-lg border border-yellow-400 flex items-center justify-center text-xl font-bold">؟</div>
                        <div class="card-back absolute w-full h-full bg-gray-700 rounded-lg border border-green-400 flex items-center justify-center text-xs font-bold p-1 text-center card-result">--</div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Referral Section -->
        <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 space-y-3 shadow">
            <h2 class="text-md font-bold text-yellow-400">نظام الإحالة</h2>
            <p class="text-xs text-gray-300">شاركي الرابط مع أصدقائك واحصلي على 50 نقطة لكل شخص يسجل عبر رابطك!</p>
            
            <div class="flex items-center gap-2">
                <input id="ref-link" type="text" readonly class="w-full bg-gray-900 border border-gray-700 text-xs p-2 rounded text-gray-400 dir-ltr" value="">
                <button onclick="copyReferralLink()" class="bg-green-600 hover:bg-green-700 text-white text-xs px-4 py-2 rounded whitespace-nowrap transition font-bold">
                    نسخ
                </button>
            </div>
        </div>

    </main>

    <script>
        // رابط متجرك المباشر
        const STORE_URL = "https://t.me/HR409";

        // إعدادات الجوائز بنظام الأوزان (إذا كان الوزن 0 لا يفوز بها أحد)
        const prizes = [
            { name: "حظ أوفر", points: 0, weight: 50 },
            { name: "10 نقاط", points: 10, weight: 30 },
            { name: "25 نقطة", points: 25, weight: 15 },
            { name: "50 نقطة", points: 50, weight: 5 },
            { name: "الجائزة الكبرى", points: 100, weight: 0 } // وزن 0 = مستحيل الفوز بها
        ];

        // إدارة المستخدم والتخزين
        let userId = localStorage.getItem('user_id');
        if (!userId) {
            userId = Math.floor(100000 + Math.random() * 900000);
            localStorage.setItem('user_id', userId);
        }

        let points = parseInt(localStorage.getItem('points')) || 100;
        document.getElementById('user-points').innerText = points;

        // توليد رابط الإحالة الخاص بالمتجر
        function getReferralLink(id) {
            return `${STORE_URL}?start=${id}`;
        }

        const refInput = document.getElementById('ref-link');
        refInput.value = getReferralLink(userId);

        function copyReferralLink() {
            refInput.select();
            document.execCommand('copy');
            alert('تم نسخ رابط الإحالة بنجاح!');
        }

        // دالة اختيار الجائزة بناءً على الأوزان
        function getRandomPrize() {
            const validPrizes = prizes.filter(p => p.weight > 0);
            const totalWeight = validPrizes.reduce((sum, p) => sum + p.weight, 0);
            
            if (totalWeight === 0) return { name: "حظ أوفر", points: 0 };

            let randomNum = Math.random() * totalWeight;
            for (let prize of validPrizes) {
                if (randomNum < prize.weight) {
                    return prize;
                }
                randomNum -= prize.weight;
            }
            return validPrizes[0];
        }

        // المكافأة اليومية
        function claimDailyReward() {
            const lastClaim = localStorage.getItem('last_claim');
            const now = new Date().getTime();

            if (lastClaim && now - lastClaim < 86400000) {
                alert('لقد أخذت المكافأة اليومية بالفعل، عد غداً!');
                return;
            }

            points += 10;
            localStorage.setItem('points', points);
            localStorage.setItem('last_claim', now);
            document.getElementById('user-points').innerText = points;
            alert('تمت إضافة 10 نقاط إلى رصيدك!');
        }

        // تدوير العجلة
        function spinWheel() {
            const lastSpin = localStorage.getItem('last_spin');
            const now = new Date().getTime();

            if (lastSpin && now - lastSpin < 86400000) {
                alert('يمكنك تدوير العجلة مرة واحدة كل 24 ساعة!');
                return;
            }

            const prize = getRandomPrize();
            const wheel = document.getElementById('wheel');
            const randomDegree = Math.floor(1800 + Math.random() * 360);
            
            wheel.style.transform = `rotate(${randomDegree}deg)`;

            setTimeout(() => {
                if (prize.points > 0) {
                    points += prize.points;
                    localStorage.setItem('points', points);
                    document.getElementById('user-points').innerText = points;
                    alert(`مبروك! فزت بـ: ${prize.name}`);
                } else {
                    alert(`حظ أوفر! لم تفز هذه المرة.`);
                }
                localStorage.setItem('last_spin', now);
            }, 4000);
        }

        // كشف البطاقات
        let cardFlippedToday = false;
        function flipCard(cardElement, index) {
            if (cardFlippedToday) {
                alert('يمكنك كشف بطاقة واحدة فقط يومياً!');
                return;
            }

            const inner = cardElement.querySelector('.card-inner');
            const resultText = cardElement.querySelector('.card-result');
            
            if (inner.classList.contains('flipped')) return;

            const prize = getRandomPrize();
            resultText.innerText = prize.name;
            inner.classList.add('flipped');
            cardFlippedToday = true;

            if (prize.points > 0) {
                points += prize.points;
                localStorage.setItem('points', points);
                document.getElementById('user-points').innerText = points;
            }
        }
    </script>
</body>
</html>
