<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>متجر هيبه الرسمي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* العجلة البنفسجية المطابقة للتصميم القديم */
        .wheel-container { position: relative; width: 280px; height: 280px; border-radius: 50%; border: 6px solid #8b5cf6; box-shadow: 0 0 25px rgba(139, 92, 246, 0.5); }
        .wheel { width: 100%; height: 100%; border-radius: 50%; transition: transform 5s cubic-bezier(0.15, 0.99, 0.15, 0.99); position: relative; overflow: hidden; }
        .prize-slice { position: absolute; width: 50%; height: 50%; top: 0; right: 0; transform-origin: 0% 100%; }
        .prize-content { position: absolute; right: -100%; top: 25%; transform: rotate(-45deg); display: flex; flex-direction: column; align-items: center; color: white; width: 110px; text-align: center; font-weight: bold; }
        .wheel-pointer { position: absolute; top: -14px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 14px solid transparent; border-right: 14px solid transparent; border-top: 22px solid #06b6d4; z-index: 10; filter: drop-shadow(0 2px 4px rgba(0,0,0,0.5)); }
    </style>
</head>
<body class="bg-[#090a16] text-white min-h-screen pb-20 select-none">

    <!-- Toast Notification -->
    <div id="toast" class="fixed top-4 left-1/2 -translate-x-1/2 z-50 bg-cyan-400 text-black px-4 py-2 rounded-xl text-xs font-bold shadow-lg opacity-0 pointer-events-none transition-all duration-300">
        تم بنجاح! ✨
    </div>

    <!-- Header القديم -->
    <header class="p-4 flex justify-between items-center bg-[#0d0e21]/80 backdrop-blur border-b border-purple-900/30">
        <div class="flex items-center gap-2">
            <span class="text-xs bg-purple-900/40 border border-purple-500/30 px-3 py-1 rounded-full text-purple-200">👥 الزوار: 1525</span>
        </div>
        <div onclick="triggerAdminAccess()" class="text-right cursor-pointer">
            <h1 class="text-sm font-bold text-cyan-400 flex items-center justify-end gap-1">👑 متجر هيبه الرسمي</h1>
            <p class="text-[10px] text-gray-400">انقر مرتين هنا للدخول للأدمن</p>
        </div>
    </header>

    <!-- Main Container -->
    <main class="px-4 max-w-md mx-auto space-y-4 pt-4">

        <!-- المكافأة اليومية (الشكل القديم) -->
        <div class="bg-gradient-to-r from-purple-950/40 to-indigo-950/40 border border-purple-500/30 p-3 rounded-2xl flex justify-between items-center">
            <button onclick="claimDailyReward()" class="bg-cyan-500 hover:bg-cyan-400 text-black font-extrabold px-4 py-2 rounded-xl text-xs transition active:scale-95 shadow-md shadow-cyan-500/20 flex items-center gap-1">
                🎁 استلام
            </button>
            <div class="text-right">
                <h3 class="text-xs font-bold text-cyan-300 flex items-center justify-end gap-1">📅 المكافأة اليومية</h3>
                <p class="text-[11px] text-gray-300">احصل على +20 نقطة يومياً</p>
            </div>
        </div>

        <!-- حالة الاشتراك (الشكل القديم) -->
        <div id="subChannelBox" class="bg-purple-950/30 border border-purple-500/30 p-3 rounded-2xl text-center">
            <a href="https://t.me/HR409" target="_blank" onclick="markChannelClickedAndAutoSubscribe()" class="block text-xs text-emerald-400 font-bold py-1">
                ✅ أنت مشترك في القناة وعجلة الحظ جاهزة!
            </a>
        </div>

        <!-- Wheel Section القديم -->
        <div id="wheelWrapper" class="flex flex-col items-center justify-center py-2 space-y-4">
            <div class="wheel-container">
                <div class="wheel-pointer"></div>
                <div id="wheel" class="wheel"></div>
            </div>

            <!-- زر العجلة السفلي القديم -->
            <button id="spinBtn" onclick="spinWheel()" class="w-full bg-[#13152d] border border-purple-500/30 text-gray-300 font-bold py-3 rounded-2xl text-xs transition active:scale-98 shadow-lg">
                العجلة مقفولة مؤقتاً
            </button>

            <p id="timerText" class="text-xs text-amber-400 font-bold text-center flex items-center justify-center gap-1">
                ⏳ متبقي للتدوير القادم: 23س 30د 59ث
            </p>
        </div>

    </main>

    <!-- Bottom Navigation Bar القديم بالكامل -->
    <nav class="fixed bottom-0 left-0 right-0 bg-[#0d0e21] border-t border-purple-900/30 p-2 z-40 flex justify-around">
        <button class="text-cyan-400 flex flex-col items-center gap-1">
            <span class="text-lg">🎡</span>
            <span class="text-[10px] font-bold">العجلة</span>
        </button>
        <button class="text-gray-400 flex flex-col items-center gap-1">
            <span class="text-lg">🛒</span>
            <span class="text-[10px] font-bold">المتجر</span>
        </button>
        <button class="text-gray-400 flex flex-col items-center gap-1">
            <span class="text-lg">🎁</span>
            <span class="text-[10px] font-bold">جوائزي</span>
        </button>
        <button class="text-gray-400 flex flex-col items-center gap-1">
            <span class="text-lg">🔔</span>
            <span class="text-[10px] font-bold">المشتركين</span>
        </button>
        <button class="text-gray-400 flex flex-col items-center gap-1">
            <span class="text-lg">👤</span>
            <span class="text-[10px] font-bold">حسابي</span>
        </button>
    </nav>

    <!-- Admin Panel Modal -->
    <div id="adminPanelModal" class="fixed inset-0 bg-black/90 backdrop-blur-md z-50 p-4 overflow-y-auto hidden">
        <div class="max-w-md mx-auto space-y-4">
            <div class="flex justify-between items-center border-b border-purple-900/50 pb-2">
                <h2 class="text-sm font-black text-cyan-400">🔑 لوحة تحكم الأدمن</h2>
                <button onclick="closeAdminPanel()" class="bg-rose-600 text-white px-3 py-1 rounded-xl text-xs font-bold">إغلاق</button>
            </div>

            <div class="bg-[#0d0e21] p-3 rounded-2xl border border-purple-900/50 space-y-2">
                <h3 class="text-xs font-bold text-cyan-300">🎡 إدارة جوائز العجلة:</h3>
                <div id="adminWheelEditor" class="space-y-1.5 max-h-40 overflow-y-auto"></div>
                <div class="pt-2 border-t border-purple-900/50 grid grid-cols-2 gap-1">
                    <input id="newWheelName" type="text" placeholder="اسم الجائزة" class="bg-black/60 border border-purple-900/50 p-1.5 rounded-xl text-[11px] text-white">
                    <input id="newWheelWeight" type="number" placeholder="الوزن (0 للمنع)" class="bg-black/60 border border-purple-900/50 p-1.5 rounded-xl text-[11px] text-white">
                </div>
                <button onclick="addNewWheelPrize()" class="w-full bg-cyan-600 text-black font-bold py-1.5 rounded-xl text-xs">إضافة جائزة</button>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        const FIXED_USER = 'tnn40'; 
        const ADMIN_PIN = '6430087';

        let defaultPrizes = [
            { name: "100$", weight: 0 },
            { name: "1000 شدة", weight: 0 }, 
            { name: "100 نقطة", weight: 20 },
            { name: "تيك توك", weight: 10 },
            { name: "كارت سيارة", weight: 0 },   
            { name: "آسيا 5$", weight: 15 }
        ];

        // الألوان الداكنة البنفسجية المطلوبة للتصميم القديم
        const oldDarkColors = ['#1a103c', '#110926', '#1a103c', '#110926', '#1a103c', '#110926'];

        function showToast(msg) {
            let toast = document.getElementById('toast');
            toast.innerText = msg;
            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }

        function getPrizes() {
            let saved = localStorage.getItem('hiba_wheel_prizes');
            return saved ? JSON.parse(saved) : defaultPrizes;
        }

        function renderWheel() {
            let prizes = getPrizes();
            let wheel = document.getElementById('wheel');
            if(!wheel) return;
            wheel.innerHTML = '';
            let angleStep = 360 / prizes.length;
            let conicGradients = [];

            prizes.forEach((p, index) => {
                let startAngle = index * angleStep;
                let endAngle = (index + 1) * angleStep;
                let bgColor = oldDarkColors[index % oldDarkColors.length];
                conicGradients.push(`${bgColor} ${startAngle}deg ${endAngle}deg`);

                let slice = document.createElement('div');
                slice.className = 'prize-slice';
                slice.style.transform = `rotate(${startAngle + (angleStep / 2)}deg)`;
                
                let content = document.createElement('div');
                content.className = 'prize-content';
                content.innerHTML = `<span class="text-xs text-purple-200">${p.name}</span>`;
                
                slice.appendChild(content);
                wheel.appendChild(slice);
            });
            wheel.style.background = `conic-gradient(${conicGradients.join(', ')})`;
        }

        function markChannelClickedAndAutoSubscribe() {
            localStorage.setItem(FIXED_USER + '_hiba_subscribed', 'true');
            showToast("تم التحقق وتأكيد اشتراكك تلقائياً! ✅");
        }

        function checkTimer() {
            let lastSpin = localStorage.getItem(FIXED_USER + '_hiba_last_spin');
            let spinBtn = document.getElementById('spinBtn');
            let timerText = document.getElementById('timerText');

            if(!lastSpin) {
                if(spinBtn) {
                    spinBtn.disabled = false;
                    spinBtn.innerText = "اضغط هنا للتدوير 🎡";
                    spinBtn.className = "w-full bg-cyan-500 hover:bg-cyan-400 text-black font-extrabold py-3 rounded-2xl text-xs transition active:scale-95 shadow-lg shadow-cyan-500/20";
                }
                if(timerText) timerText.innerText = 'العجلة جاهزة للتدوير الأن! 🎉';
                return;
            }

            let diff = new Date().getTime() - parseInt(lastSpin);
            let cooldown = 24 * 60 * 60 * 1000;

            if(diff < cooldown) {
                let remaining = cooldown - diff;
                let hours = Math.floor(remaining / (1000 * 60 * 60));
                let minutes = Math.floor((remaining % (1000 * 60 * 60)) / (1000 * 60));
                let seconds = Math.floor((remaining % (1000 * 60)) / 1000);

                if(spinBtn) {
                    spinBtn.disabled = true;
                    spinBtn.innerText = "العجلة مقفولة مؤقتاً";
                    spinBtn.className = "w-full bg-[#13152d] border border-purple-500/30 text-gray-400 font-bold py-3 rounded-2xl text-xs";
                }
                if(timerText) timerText.innerText = `⏳ متبقي للتدوير القادم: ${hours}س ${minutes}د ${seconds}ث`;

                setTimeout(checkTimer, 1000);
            } else {
                if(spinBtn) {
                    spinBtn.disabled = false;
                    spinBtn.innerText = "اضغط هنا للتدوير 🎡";
                    spinBtn.className = "w-full bg-cyan-500 hover:bg-cyan-400 text-black font-extrabold py-3 rounded-2xl text-xs transition active:scale-95 shadow-lg shadow-cyan-500/20";
                }
                if(timerText) timerText.innerText = 'العجلة جاهزة للتدوير الأن! 🎉';
            }
        }

        let isSpinning = false;
        function spinWheel() {
            if(isSpinning) return;
            
            let allPrizes = getPrizes();
            let validPrizes = allPrizes.map((p, index) => ({ ...p, originalIndex: index })).filter(p => (Number(p.weight) || 0) > 0);
            
            if(validPrizes.length === 0) {
                alert("لا توجد جوائز متاحة حالياً!");
                return;
            }

            isSpinning = true;
            let wheel = document.getElementById('wheel');

            let totalWeight = validPrizes.reduce((sum, p) => sum + Number(p.weight), 0);
            let randomNum = Math.random() * totalWeight;
            let currentSum = 0;
            let chosenObj = validPrizes[0];
            
            for (let i = 0; i < validPrizes.length; i++) {
                currentSum += Number(validPrizes[i].weight);
                if (randomNum <= currentSum) {
                    chosenObj = validPrizes[i];
                    break;
                }
            }

            let winningIndex = chosenObj.originalIndex;
            let angleStep = 360 / allPrizes.length;
            let targetAngle = 360 - (winningIndex * angleStep) - (angleStep / 2);
            wheel.style.transform = `rotate(${360 * 8 + targetAngle}deg)`;

            setTimeout(() => {
                isSpinning = false;
                localStorage.setItem(FIXED_USER + '_hiba_last_spin', new Date().getTime().toString());
                let wonPrize = allPrizes[winningIndex];
                
                checkTimer();
                showToast(`تهانينا! فزت بـ: (${wonPrize.name}) 🎉`);
            }, 5000);
        }

        let adminClickTimer = 0;
        function triggerAdminAccess() {
            adminClickTimer++;
            if(adminClickTimer >= 2) {
                adminClickTimer = 0;
                let inputPin = prompt("🔑 أدخل رمز الحماية للأدمن:");
                if(inputPin === ADMIN_PIN) {
                    loadAdminData();
                    document.getElementById('adminPanelModal').classList.remove('hidden');
                } else if(inputPin !== null) {
                    alert("❌ الرمز غير صحيح!");
                }
            }
            setTimeout(() => { adminClickTimer = 0; }, 1000);
        }

        function closeAdminPanel() { 
            document.getElementById('adminPanelModal').classList.add('hidden');
            renderWheel();
        }

        function loadAdminData() {
            let wheelEditor = document.getElementById('adminWheelEditor');
            let prizes = getPrizes();
            wheelEditor.innerHTML = prizes.map((p, idx) => `
                <div class="flex items-center justify-between bg-black/50 p-2 rounded-xl border border-purple-900/50">
                    <span class="text-purple-200 text-xs">${p.name} <span class="text-gray-400">(الوزن: ${p.weight})</span></span>
                    <button onclick="deleteWheelPrize(${idx})" class="bg-rose-600 text-white px-2 py-1 rounded-lg text-[10px]">حذف</button>
                </div>
            `).join('');
        }

        function addNewWheelPrize() {
            let nameInput = document.getElementById('newWheelName');
            let weightInput = document.getElementById('newWheelWeight');
            let name = nameInput.value.trim();
            let weight = parseInt(weightInput.value);
            if(isNaN(weight)) weight = 0;
            if(!name) return;

            let prizes = getPrizes();
            prizes.push({ name: name, weight: weight });
            localStorage.setItem('hiba_wheel_prizes', JSON.stringify(prizes));
            nameInput.value = '';
            weightInput.value = '';
            loadAdminData();
            showToast("تمت الإضافة بنجاح!");
        }

        function deleteWheelPrize(index) {
            let prizes = getPrizes();
            prizes.splice(index, 1);
            localStorage.setItem('hiba_wheel_prizes', JSON.stringify(prizes));
            loadAdminData();
        }

        function claimDailyReward() {
            showToast("تم استلام المكافأة اليومية (+20 نقطة)! 🎁");
        }

        window.addEventListener('DOMContentLoaded', () => {
            renderWheel();
            checkTimer();
        });
    </script>
</body>
</html>
